name: Deploy React App to Pi4
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner_lc }}/portfolio:latest
          platforms: linux/arm64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/download/2024.11.0/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config << EOF
          Host ssh.powerbander.tech
            StrictHostKeyChecking no
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access tcp --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on Pi4
        env:
          OWNER_LC: ${{ needs.build.outputs.owner_lc }}
        run: |
          ssh -T \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@ssh.powerbander.tech << EOF
          set -e
          docker pull ghcr.io/$OWNER_LC/portfolio:latest
          docker rm -f portfolio || true
          docker run -d \
            --name portfolio \
            --restart unless-stopped \
            -p 3001:80 \
            ghcr.io/$OWNER_LC/portfolio:latest
          EOF
